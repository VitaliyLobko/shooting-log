<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101310">
  <meta name="description" content="Учёт боеприпасов, настрела по стволам и рецептов снаряжения">
  <title>Настрел</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('shooting-log:theme') || 'auto'; } catch (e) { /* приватний режим */ }
      var light = pref === 'light' || (pref === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
  <script src="version.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 id="title">БК</h1>
      <button type="button" id="sync-chip" class="sync-chip" hidden></button>
    </div>
    <div id="subtitle" class="muted"></div>
  </header>

  <div id="update" class="update" hidden>
    <span data-i18n="Доступна новая версия">Доступна новая версия</span>
    <button type="button" id="update-btn" data-i18n="Обновить">Обновить</button>
  </div>

  <main id="view" class="view"></main>

  <button type="button" id="fab" class="fab" aria-label="Добавить" data-i18n-aria="Добавить">+</button>

  <nav class="tabs">
    <a href="#ammo" data-tab="ammo">
      <svg viewBox="0 0 24 24"><path d="M2.5 21V11l.8-1.5V7c0-1.4.6-2.8 1.2-3.5.6.7 1.2 2.1 1.2 3.5v2.5l.8 1.5v10z"/><path d="M10 21V11l.8-1.5V7c0-1.4.6-2.8 1.2-3.5.6.7 1.2 2.1 1.2 3.5v2.5l.8 1.5v10z"/><path d="M17.5 21V11l.8-1.5V7c0-1.4.6-2.8 1.2-3.5.6.7 1.2 2.1 1.2 3.5v2.5l.8 1.5v10z"/><path d="M2.5 14h4M10 14h4M17.5 14h4"/></svg>
      <span data-i18n="БК">БК</span>
    </a>
    <a href="#guns" data-tab="guns">
      <svg viewBox="0 0 24 24"><path d="M2 13.5V10l3-1.5h11V12H5.5z"/><path d="M16 9.5h6M19 8v1.5"/><path d="M8 12l-1 4.5h2.2L10.5 12M12 12l.6 4h2.1L14 12"/><path d="M9 8.5V7h4v1.5"/></svg>
      <span data-i18n="Оружие">Оружие</span>
    </a>
    <a href="#log" data-tab="log">
      <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span data-i18n="Журнал">Журнал</span>
    </a>
    <a href="#reload" data-tab="reload">
      <svg viewBox="0 0 24 24"><path d="M12 5v15M8 20h8M5 7h14"/><circle cx="12" cy="4" r="1.2"/><path d="M5 7l-2.5 6M5 7l2.5 6M2 13a3 3 0 0 0 6 0zM19 7l-2.5 6M19 7l2.5 6M16 13a3 3 0 0 0 6 0z"/></svg>
      <span data-i18n="Рецепты">Рецепты</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>
      <span data-i18n="Ещё">Ещё</span>
    </a>
  </nav>

  <div id="layer"></div>
</body>
</html>
