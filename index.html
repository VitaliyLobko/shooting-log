<!doctype html>
<html lang="uk">
<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-NPuNhUOwinOqk7NmoiJUdHN1vZuKa1s8RDelQdpHAC4=' https://accounts.google.com https://apis.google.com; connect-src 'self' https://bank.gov.ua https://www.googleapis.com https://accounts.google.com https://api.open-meteo.com https://archive-api.open-meteo.com; img-src 'self' data: blob: https://lh3.googleusercontent.com https://*.googleusercontent.com; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' blob:; frame-src https://accounts.google.com https://content.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'none'">

  <title>Shooters Log</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('shooters-log:theme') || localStorage.getItem('scouts-log:theme') || 'auto'; } catch (e) { /* приватний режим */ }
      var light = pref === 'light' || (pref === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
  <script src="version.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="topbar-brand"><a href="#ammo" id="back-btn" class="gear back-btn" hidden aria-label="Назад" data-i18n-aria="Назад"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><img id="app-icon" class="app-icon" alt="" hidden><h1 id="title">Shooters Log</h1></div>
      <div class="topbar-actions">
        <button type="button" id="sync-chip" class="sync-chip" hidden></button>
        <a href="#settings" id="settings-btn" class="gear" aria-label="Настройки" data-i18n-aria="Настройки">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.6"/><path d="M19 12h2.6M16.95 16.95l1.84 1.84M12 19v2.6M7.05 16.95l-1.84 1.84M5 12H2.4M7.05 7.05L5.21 5.21M12 5V2.4M16.95 7.05l1.84-1.84"/></svg>
        </a>
      </div>
    </div>
    <div id="subtitle" class="muted"></div>
  </header>

  <div id="update" class="update" hidden>
    <span data-i18n="Доступна новая версия">Доступна новая версия</span>
    <button type="button" id="update-btn" data-i18n="Обновить">Обновить</button>
  </div>

  <main id="view" class="view"></main>

  <button type="button" id="fab" class="fab" aria-label="Добавить" data-i18n-aria="Добавить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

  <nav class="tabs">
    <a href="#ammo" data-tab="ammo">
      <svg viewBox="0 0 24 24"><path d="M2.5 21V11l.8-1.5V7c0-1.4.6-2.8 1.2-3.5.6.7 1.2 2.1 1.2 3.5v2.5l.8 1.5v10z"/><path d="M10 21V11l.8-1.5V7c0-1.4.6-2.8 1.2-3.5.6.7 1.2 2.1 1.2 3.5v2.5l.8 1.5v10z"/><path d="M17.5 21V11l.8-1.5V7c0-1.4.6-2.8 1.2-3.5.6.7 1.2 2.1 1.2 3.5v2.5l.8 1.5v10z"/><path d="M2.5 14h4M10 14h4M17.5 14h4"/></svg>
      <span data-i18n="Склад">Склад</span>
    </a>
    <a href="#guns" data-tab="guns">
      <svg viewBox="0 0 24 24"><path d="M4 3h16v9.5c0 4.8-3.6 8.2-8 9.5-4.4-1.3-8-4.7-8-9.5z"/><g transform="translate(12 12) scale(.64) translate(-12 -11.6)" stroke-width="2.4"><path d="M5.5 4.5v9.5a3.5 3.5 0 0 0 3.5 3.5H12M18.5 4.5v9.5a3.5 3.5 0 0 1-3.5 3.5H12M12 6v11.5M12 17.5v3M5.5 10c2.6.3 4.3 2.2 4.5 5M18.5 10c-2.6.3-4.3 2.2-4.5 5M12 2.5l1.4 2-1.4 1.5-1.4-1.5z"/></g></svg>
      <span data-i18n="Арсенал">Арсенал</span>
    </a>
    <a href="#log" data-tab="log">
      <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span data-i18n="Журнал">Журнал</span>
    </a>
    <a href="#targets" data-tab="targets">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>
      <span data-i18n="Полигон">Полигон</span>
    </a>
  </nav>

  <div id="layer"></div>

</html>
